name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job ids `ci` and `smoke` are the required status checks of the `main` ruleset (.github/rulesets/main.json):
# renaming either job requires updating the ruleset, or every PR to main waits for a check that never reports.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run ui:scan
      - run: npx astro check
      - run: npx vitest run --project unit --project component
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Only on pull requests: code reaches main through a PR that already passed smoke, and production is used as a dev
  # environment, so a deploy does not wait for a second run (~2.5 min).
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|DB_URL)=' > supabase.env
      - name: Import registry fixtures (v1, v1, v2) and check the result
        run: |
          source supabase.env
          export DATABASE_URL="$DB_URL"
          npm run registry:import -- --file scripts/fixtures/rpl-sample-v1.xml
          npm run registry:import -- --file scripts/fixtures/rpl-sample-v1.xml
          npm run registry:import -- --file scripts/fixtures/rpl-sample-v2.xml
          node scripts/registry-import-check.mjs
          npm run test:db
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke and API tests against production preview
        run: |
          source supabase.env
          export DATABASE_URL="$DB_URL"
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
          BASE_URL=http://localhost:4321 npm run test:api
      - if: always()
        run: supabase stop --no-backup

  deploy:
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

name: Registry import

on:
  # Scheduled runs always use the default branch, so the main-only guard below passes. A failed run emails the user
  # who last changed the cron line (GitHub's failed-workflow notification).
  schedule:
    # 04:17 UTC, off the full hour, where GitHub delays and drops more runs.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: registry-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    # The secret holds production owner credentials: only main's version of the import may use it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A full import takes well under a minute; a stalled RPL download must not hold a production transaction for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub runners have no IPv6 and the direct Supabase database host is IPv6-only, so the secret must be
      # the Supavisor pooler connection string in session mode (port 5432).
      - name: Import RPL export into the production database
        env:
          DATABASE_URL: ${{ secrets.REGISTRY_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret REGISTRY_DATABASE_URL is not set"
            exit 1
          fi
          npm run registry:import

  # GitHub disables scheduled workflows in a public repository after 60 days without repository activity, and the
  # daily import would then stop silently. A commit cannot keep it alive (main requires a PR), and third-party
  # keepalive actions are a supply-chain risk, so every run re-enables this workflow through the REST API instead.
  # GitHub does not document that this resets the 60-day counter: the stale-data warning on /szukaj and /apteczka
  # is the independent signal if it does not. Separate job, so the import job with the production secret gets no
  # extra permission, and no `needs`, so it runs even when the import fails.
  keepalive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/registry-import.yml/enable"
